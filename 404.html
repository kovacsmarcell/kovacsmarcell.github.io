<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<meta name="theme-color" content="#0b1230" />
<style>
:root{--paper:#f5f1e8;--ink:#0c1020;--ink-3:#5b6079;--rule:#d9d2c0;--accent:#1f4ed8}
@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:32px 16px}
main{max-width:560px;width:100%}
.code{font:500 12px/1 ui-monospace,"JetBrains Mono",Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
h1{font:400 clamp(40px,9vw,72px)/1.05 "Instrument Serif",Georgia,"Times New Roman",serif;margin:20px 0 16px}
p{color:var(--ink-3);font-size:17px}
.rule{height:1px;background:var(--rule);margin:28px 0}
a{color:var(--accent);text-underline-offset:4px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style>
</head>
